name: Supabase keepalive

on:
  schedule:
    - cron: "0 7 */4 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Wikilinks keepalive endpoint
        run: |
          curl --fail --show-error --silent \
            "https://wikilinks.liagil.es/api/keepalive" \
            --output /dev/null

          echo "Wikilinks keepalive completed."
